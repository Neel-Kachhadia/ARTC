name: artc-phase1

services:
  service-b:
    image: artc-phase1:local
    build:
      context: ..
      dockerfile: lab/Dockerfile
    command: ["/opt/artc/bin/artc_lab_node", "service-b", "0.0.0.0:50052", "service-b", "${ARTC_SERVICE_B_DELAY_US:-0}"]
    init: true
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "/opt/artc/bin/artc_loadgen", "--health", "--target", "127.0.0.1:50052"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

  a1:
    image: artc-phase1:local
    command: ["/opt/artc/bin/artc_lab_node", "service-a", "0.0.0.0:50051", "A1", "${ARTC_SERVICE_A1_DELAY_US:-0}", "service-b:50052"]
    init: true
    cpus: "1.0"
    cap_add: [NET_ADMIN]
    environment:
      ARTC_SERVICE_A_UNAVAILABLE_FIRST_N: ${ARTC_SERVICE_A1_UNAVAILABLE_FIRST_N:-${ARTC_SERVICE_A_UNAVAILABLE_FIRST_N:-0}}
      ARTC_SERVICE_A_HONOR_CANCELLATION: ${ARTC_SERVICE_A1_HONOR_CANCELLATION:-${ARTC_SERVICE_A_HONOR_CANCELLATION:-true}}
    depends_on:
      service-b:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/opt/artc/bin/artc_loadgen", "--health", "--target", "127.0.0.1:50051"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

  a2:
    image: artc-phase1:local
    command: ["/opt/artc/bin/artc_lab_node", "service-a", "0.0.0.0:50051", "A2", "${ARTC_SERVICE_A2_DELAY_US:-0}", "service-b:50052"]
    init: true
    cpus: "1.0"
    cap_add: [NET_ADMIN]
    environment:
      ARTC_SERVICE_A_UNAVAILABLE_FIRST_N: ${ARTC_SERVICE_A2_UNAVAILABLE_FIRST_N:-${ARTC_SERVICE_A_UNAVAILABLE_FIRST_N:-0}}
      ARTC_SERVICE_A_HONOR_CANCELLATION: ${ARTC_SERVICE_A2_HONOR_CANCELLATION:-${ARTC_SERVICE_A_HONOR_CANCELLATION:-true}}
    depends_on:
      service-b:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/opt/artc/bin/artc_loadgen", "--health", "--target", "127.0.0.1:50051"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

  a3:
    image: artc-phase1:local
    command: ["/opt/artc/bin/artc_lab_node", "service-a", "0.0.0.0:50051", "A3", "${ARTC_SERVICE_A3_DELAY_US:-0}", "service-b:50052"]
    init: true
    cpus: "1.0"
    cap_add: [NET_ADMIN]
    environment:
      ARTC_SERVICE_A_UNAVAILABLE_FIRST_N: ${ARTC_SERVICE_A3_UNAVAILABLE_FIRST_N:-${ARTC_SERVICE_A_UNAVAILABLE_FIRST_N:-0}}
      ARTC_SERVICE_A_HONOR_CANCELLATION: ${ARTC_SERVICE_A3_HONOR_CANCELLATION:-${ARTC_SERVICE_A_HONOR_CANCELLATION:-true}}
    depends_on:
      service-b:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/opt/artc/bin/artc_loadgen", "--health", "--target", "127.0.0.1:50051"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

  router:
    image: artc-phase1:local
    command:
      - /opt/artc/bin/artc_lab_node
      - router
      - 0.0.0.0:50050
      - ${ARTC_ROUTING_POLICY:-round_robin}
      - "17"
      - "0.2"
      - A1=a1:50051
      - A2=a2:50051
      - A3=a3:50051
    environment:
      ARTC_AIMD_MIN_LIMIT: ${ARTC_AIMD_MIN_LIMIT:-1}
      ARTC_AIMD_MAX_LIMIT: ${ARTC_AIMD_MAX_LIMIT:-512}
      ARTC_AIMD_INITIAL_LIMIT: ${ARTC_AIMD_INITIAL_LIMIT:-64}
      ARTC_AIMD_ALPHA: ${ARTC_AIMD_ALPHA:-2}
      ARTC_AIMD_BETA: ${ARTC_AIMD_BETA:-0.7}
      ARTC_AIMD_INTERVAL_MS: ${ARTC_AIMD_INTERVAL_MS:-100}
      ARTC_AIMD_MIN_SAMPLES: ${ARTC_AIMD_MIN_SAMPLES:-16}
      ARTC_AIMD_TARGET_LATENCY_US: ${ARTC_AIMD_TARGET_LATENCY_US:-50000}
      ARTC_AIMD_OVERLOAD_ERROR_FRACTION: ${ARTC_AIMD_OVERLOAD_ERROR_FRACTION:-0.1}
      ARTC_DEADLINE_MARGIN_US: ${ARTC_DEADLINE_MARGIN_US:-1000}
      ARTC_DEFAULT_DEADLINE_MS: ${ARTC_DEFAULT_DEADLINE_MS:-5000}
      ARTC_DECISION_SAMPLE_EVERY: ${ARTC_DECISION_SAMPLE_EVERY:-0}
      ARTC_HEALTH_MIN_SAMPLES: ${ARTC_HEALTH_MIN_SAMPLES:-4}
      ARTC_HEALTH_FAILURES: ${ARTC_HEALTH_FAILURES:-3}
      ARTC_HEALTH_RECOVERY_SUCCESSES: ${ARTC_HEALTH_RECOVERY_SUCCESSES:-3}
      ARTC_HEALTH_RECOVERY_COOLDOWN_MS: ${ARTC_HEALTH_RECOVERY_COOLDOWN_MS:-500}
      ARTC_HEALTH_DEGRADED_RATIO: ${ARTC_HEALTH_DEGRADED_RATIO:-2.0}
      ARTC_HEALTH_RECOVERED_RATIO: ${ARTC_HEALTH_RECOVERED_RATIO:-1.5}
      ARTC_RECOVERY_PROBE_PERIOD: ${ARTC_RECOVERY_PROBE_PERIOD:-16}
      ARTC_ATTEMPT_MAX_TOTAL: ${ARTC_ATTEMPT_MAX_TOTAL:-3}
      ARTC_ATTEMPT_MAX_ACTIVE: ${ARTC_ATTEMPT_MAX_ACTIVE:-2}
      ARTC_ATTEMPT_JITTER_SEED: ${ARTC_ATTEMPT_JITTER_SEED:-1}
      ARTC_ATTEMPT_MINIMUM_BUDGET_US: ${ARTC_ATTEMPT_MINIMUM_BUDGET_US:-1000}
      ARTC_HEDGE_BUDGET_CAPACITY: ${ARTC_HEDGE_BUDGET_CAPACITY:-10}
      ARTC_HEDGE_BUDGET_REFILL_PER_SECOND: ${ARTC_HEDGE_BUDGET_REFILL_PER_SECOND:-1.0}
      ARTC_RETRY_BUDGET_CAPACITY: ${ARTC_RETRY_BUDGET_CAPACITY:-10}
      ARTC_RETRY_BUDGET_REFILL_PER_SECOND: ${ARTC_RETRY_BUDGET_REFILL_PER_SECOND:-1.0}
      ARTC_EXECUTE_IDEMPOTENCY: ${ARTC_EXECUTE_IDEMPOTENCY:-non_idempotent}
      ARTC_EXECUTE_HEDGING_ENABLED: ${ARTC_EXECUTE_HEDGING_ENABLED:-false}
      ARTC_EXECUTE_RETRY_ENABLED: ${ARTC_EXECUTE_RETRY_ENABLED:-false}
      ARTC_EXECUTE_ALLOW_SAME_REPLICA_RETRY: ${ARTC_EXECUTE_ALLOW_SAME_REPLICA_RETRY:-false}
      ARTC_EXECUTE_MAX_TOTAL_ATTEMPTS: ${ARTC_EXECUTE_MAX_TOTAL_ATTEMPTS:-1}
      ARTC_EXECUTE_MAX_RETRIES: ${ARTC_EXECUTE_MAX_RETRIES:-0}
      ARTC_EXECUTE_HEDGE_DELAY_MIN_US: ${ARTC_EXECUTE_HEDGE_DELAY_MIN_US:-10000}
      ARTC_EXECUTE_HEDGE_DELAY_MAX_US: ${ARTC_EXECUTE_HEDGE_DELAY_MAX_US:-100000}
      ARTC_EXECUTE_RETRY_BACKOFF_BASE_MS: ${ARTC_EXECUTE_RETRY_BACKOFF_BASE_MS:-10}
      ARTC_EXECUTE_RETRY_BACKOFF_MAX_MS: ${ARTC_EXECUTE_RETRY_BACKOFF_MAX_MS:-100}
      ARTC_EXECUTE_RETRY_JITTER_MAX_MS: ${ARTC_EXECUTE_RETRY_JITTER_MAX_MS:-10}
      ARTC_EXECUTE_RETRYABLE_STATUSES: ${ARTC_EXECUTE_RETRYABLE_STATUSES:-UNAVAILABLE}
    init: true
    cpus: "1.0"
    depends_on:
      a1:
        condition: service_healthy
      a2:
        condition: service_healthy
      a3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/opt/artc/bin/artc_loadgen", "--health", "--target", "127.0.0.1:50050"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

  loadgen:
    image: artc-phase1:local
    entrypoint: ["/opt/artc/bin/artc_loadgen"]
    profiles: [tools]
    environment:
      ARTC_RUN_ID: ${ARTC_RUN_ID:-local}
      ARTC_GIT_REVISION: ${ARTC_GIT_REVISION:-unknown}
      ARTC_WORKTREE_DIRTY: ${ARTC_WORKTREE_DIRTY:-unknown}
      ARTC_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-artc-phase1}
      ARTC_ROUTING_POLICY: ${ARTC_ROUTING_POLICY:-unknown}
      ARTC_SERVICE_B_DELAY_US: ${ARTC_SERVICE_B_DELAY_US:-0}
      ARTC_AIMD_MIN_LIMIT: ${ARTC_AIMD_MIN_LIMIT:-1}
      ARTC_AIMD_MAX_LIMIT: ${ARTC_AIMD_MAX_LIMIT:-512}
      ARTC_AIMD_INITIAL_LIMIT: ${ARTC_AIMD_INITIAL_LIMIT:-64}
      ARTC_AIMD_ALPHA: ${ARTC_AIMD_ALPHA:-2}
      ARTC_AIMD_BETA: ${ARTC_AIMD_BETA:-0.7}
      ARTC_AIMD_INTERVAL_MS: ${ARTC_AIMD_INTERVAL_MS:-100}
      ARTC_AIMD_MIN_SAMPLES: ${ARTC_AIMD_MIN_SAMPLES:-16}
      ARTC_AIMD_TARGET_LATENCY_US: ${ARTC_AIMD_TARGET_LATENCY_US:-50000}
      ARTC_AIMD_OVERLOAD_ERROR_FRACTION: ${ARTC_AIMD_OVERLOAD_ERROR_FRACTION:-0.1}
      ARTC_DEADLINE_MARGIN_US: ${ARTC_DEADLINE_MARGIN_US:-1000}
      ARTC_DEFAULT_DEADLINE_MS: ${ARTC_DEFAULT_DEADLINE_MS:-5000}
      ARTC_DECISION_SAMPLE_EVERY: ${ARTC_DECISION_SAMPLE_EVERY:-0}
      ARTC_HEALTH_MIN_SAMPLES: ${ARTC_HEALTH_MIN_SAMPLES:-4}
      ARTC_HEALTH_FAILURES: ${ARTC_HEALTH_FAILURES:-3}
      ARTC_HEALTH_RECOVERY_SUCCESSES: ${ARTC_HEALTH_RECOVERY_SUCCESSES:-3}
      ARTC_HEALTH_RECOVERY_COOLDOWN_MS: ${ARTC_HEALTH_RECOVERY_COOLDOWN_MS:-500}
      ARTC_HEALTH_DEGRADED_RATIO: ${ARTC_HEALTH_DEGRADED_RATIO:-2.0}
      ARTC_HEALTH_RECOVERED_RATIO: ${ARTC_HEALTH_RECOVERED_RATIO:-1.5}
      ARTC_RECOVERY_PROBE_PERIOD: ${ARTC_RECOVERY_PROBE_PERIOD:-16}
      ARTC_ATTEMPT_MAX_TOTAL: ${ARTC_ATTEMPT_MAX_TOTAL:-3}
      ARTC_ATTEMPT_MAX_ACTIVE: ${ARTC_ATTEMPT_MAX_ACTIVE:-2}
      ARTC_ATTEMPT_JITTER_SEED: ${ARTC_ATTEMPT_JITTER_SEED:-1}
      ARTC_ATTEMPT_MINIMUM_BUDGET_US: ${ARTC_ATTEMPT_MINIMUM_BUDGET_US:-1000}
      ARTC_HEDGE_BUDGET_CAPACITY: ${ARTC_HEDGE_BUDGET_CAPACITY:-10}
      ARTC_HEDGE_BUDGET_REFILL_PER_SECOND: ${ARTC_HEDGE_BUDGET_REFILL_PER_SECOND:-1.0}
      ARTC_RETRY_BUDGET_CAPACITY: ${ARTC_RETRY_BUDGET_CAPACITY:-10}
      ARTC_RETRY_BUDGET_REFILL_PER_SECOND: ${ARTC_RETRY_BUDGET_REFILL_PER_SECOND:-1.0}
      ARTC_EXECUTE_IDEMPOTENCY: ${ARTC_EXECUTE_IDEMPOTENCY:-non_idempotent}
      ARTC_EXECUTE_HEDGING_ENABLED: ${ARTC_EXECUTE_HEDGING_ENABLED:-false}
      ARTC_EXECUTE_RETRY_ENABLED: ${ARTC_EXECUTE_RETRY_ENABLED:-false}
      ARTC_EXECUTE_ALLOW_SAME_REPLICA_RETRY: ${ARTC_EXECUTE_ALLOW_SAME_REPLICA_RETRY:-false}
      ARTC_EXECUTE_MAX_TOTAL_ATTEMPTS: ${ARTC_EXECUTE_MAX_TOTAL_ATTEMPTS:-1}
      ARTC_EXECUTE_MAX_RETRIES: ${ARTC_EXECUTE_MAX_RETRIES:-0}
      ARTC_EXECUTE_HEDGE_DELAY_MIN_US: ${ARTC_EXECUTE_HEDGE_DELAY_MIN_US:-10000}
      ARTC_EXECUTE_HEDGE_DELAY_MAX_US: ${ARTC_EXECUTE_HEDGE_DELAY_MAX_US:-100000}
      ARTC_EXECUTE_RETRY_BACKOFF_BASE_MS: ${ARTC_EXECUTE_RETRY_BACKOFF_BASE_MS:-10}
      ARTC_EXECUTE_RETRY_BACKOFF_MAX_MS: ${ARTC_EXECUTE_RETRY_BACKOFF_MAX_MS:-100}
      ARTC_EXECUTE_RETRY_JITTER_MAX_MS: ${ARTC_EXECUTE_RETRY_JITTER_MAX_MS:-10}
      ARTC_EXECUTE_RETRYABLE_STATUSES: ${ARTC_EXECUTE_RETRYABLE_STATUSES:-UNAVAILABLE}
      ARTC_SERVICE_A_UNAVAILABLE_FIRST_N: ${ARTC_SERVICE_A_UNAVAILABLE_FIRST_N:-0}
      ARTC_SERVICE_A_HONOR_CANCELLATION: ${ARTC_SERVICE_A_HONOR_CANCELLATION:-true}
      ARTC_SERVICE_A1_DELAY_US: ${ARTC_SERVICE_A1_DELAY_US:-0}
      ARTC_SERVICE_A2_DELAY_US: ${ARTC_SERVICE_A2_DELAY_US:-0}
      ARTC_SERVICE_A3_DELAY_US: ${ARTC_SERVICE_A3_DELAY_US:-0}
      ARTC_SERVICE_A1_UNAVAILABLE_FIRST_N: ${ARTC_SERVICE_A1_UNAVAILABLE_FIRST_N:-0}
      ARTC_SERVICE_A2_UNAVAILABLE_FIRST_N: ${ARTC_SERVICE_A2_UNAVAILABLE_FIRST_N:-0}
      ARTC_SERVICE_A3_UNAVAILABLE_FIRST_N: ${ARTC_SERVICE_A3_UNAVAILABLE_FIRST_N:-0}
      ARTC_SERVICE_A1_HONOR_CANCELLATION: ${ARTC_SERVICE_A1_HONOR_CANCELLATION:-true}
      ARTC_SERVICE_A2_HONOR_CANCELLATION: ${ARTC_SERVICE_A2_HONOR_CANCELLATION:-true}
      ARTC_SERVICE_A3_HONOR_CANCELLATION: ${ARTC_SERVICE_A3_HONOR_CANCELLATION:-true}
    volumes:
      - ../artifacts/runs:/artifacts
